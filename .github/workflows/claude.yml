name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      # Mantém a branch-base na raiz.
      # A Claude Code Action seleciona a branch do PR.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Windows target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --max-turns 300
            --allowedTools "WebFetch,Bash(cargo:*)"

      # Mostra o diagnóstico quando a execução falhar.
      - name: Diagnose Claude failure
        if: failure()
        shell: bash
        run: |
          FILE="/home/runner/work/_temp/claude-execution-output.json"

          if [ -f "$FILE" ]; then
            echo "=== Diagnóstico da execução do Claude ==="
            jq '
              .. | objects |
              with_entries(
                select(
                  .key | test(
                    "error|is_error|subtype|num_turns|total_cost";
                    "i"
                  )
                )
              ) |
              select(length > 0)
            ' "$FILE"
          else
            echo "Arquivo de diagnóstico não encontrado: $FILE"
            find /home/runner/work/_temp -maxdepth 1 \
              -type f -name '*claude*' -print
          fi
