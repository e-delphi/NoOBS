name: Claude Code

# Responde a @claude em issues, PRs e revisões.
# Requer o app https://github.com/apps/claude instalado no repositório e o
# secret CLAUDE_CODE_OAUTH_TOKEN (gerado com `claude setup-token`).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Alvo Windows pro `cargo check` do porte em rust/: o check não linka,
      # então roda no runner Linux e pega erro de tipo/import antes do PR.
      - name: Rust target Windows
        run: rustup target add x86_64-pc-windows-msvc

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Tarefas grandes (ex.: conversão de linguagem) precisam de muitos
          # turnos; WebFetch libera a consulta aos cabeçalhos do FFmpeg/OBS;
          # cargo valida o porte em Rust.
          claude_args: |
            --max-turns 300
            --allowedTools "WebFetch,Bash(cargo:*)"
