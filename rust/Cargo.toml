[package]
name = "noobs"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "NoOBS: gravador de tela com libobs embarcado e UI em WebView2 (porte do Delphi para Rust, sem Tauri)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
base64 = "0.22"
sha1 = "0.10"
# O `#[implement]` expande para `windows_core::...`; precisa estar na raiz.
windows-core = "0.61"
jpeg-encoder = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Media_Audio",
  "Win32_Media_DirectShow",
  "Win32_System_Ole",
  "Win32_Media_Audio_Endpoints",
  "Win32_Storage_FileSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Networking_WinHttp",
  "Win32_System_JobObjects",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
# Embute o MAINICON (icon.ico) no exe — bandeja, janela e taskbar usam.
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
