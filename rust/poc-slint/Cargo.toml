[package]
name = "poc-slint"
version = "0.1.0"
edition = "2021"
description = "Prova de conceito: player de gravacao do NoOBS em Slint (decode na placa via D3D11VA)"
publish = false

# Crate solto, fora do app: nao entra no NoOBS.exe nem no build dele.
[workspace]

[dependencies]
slint = "1.18"
libloading = "0.8"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common",
] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
